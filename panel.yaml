esphome:
  name: ac-panel
  friendly_name: AC Panel
  on_boot:
    - priority: -100
      then:
        - script.execute: show_setup_if_needed

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: UART0

wifi:
  # Light sleep between beacons. The radio stays available, and it
  # stops holding the memory bus the whole time the screen is idle.
  power_save_mode: LIGHT
  # No station is compiled in. A saved network is used when one exists.
  # The hotspot starts only when nothing is saved. ap_timeout 0 keeps it
  # from appearing later just because the home network is down.
  ap:
    ssid: "ac-controller"
    password: "ac-control"
    ap_timeout: 0s

external_components:
  - source:
      type: local
      path: components

melcloud:
  id: ac

setup_portal:
  id: portal
  melcloud_id: ac

globals:
  - id: reset_taps
    type: int
    restore_value: no
    initial_value: "0"
  - id: reset_window_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: reset_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO38
    frequency: 1220Hz

light:
  - platform: monochromatic
    id: backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  - id: touch_bus
    sda: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true

display:
  - platform: mipi_rgb
    id: tft_display
    model: GUITION-4848S040
    update_interval: never
    auto_clear_enabled: false
    setup_priority: 200

touchscreen:
  - platform: gt911
    id: tft_touch
    i2c_id: touch_bus
    display: tft_display
    # The GT911 on this board often advertises 1024x600. ESPHome then
    # scales every tap into the top-left of the 480x480 panel.
    calibration:
      x_min: 0
      x_max: 480
      y_min: 0
      y_max: 480
    transform:
      mirror_x: true
      mirror_y: true
    # Wake on release so the first tap only restores brightness and does
    # not also activate a button underneath.
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on:
                id: backlight
                brightness: 100%

font:
  - file: gfonts://Roboto
    id: font_setpoint
    size: 64
    glyphs: "0123456789.-"
  - file: https://github.com/google/material-design-icons/raw/master/font/MaterialIcons-Regular.ttf
    id: font_control
    size: 36
    glyphs: "\uE145\uE15B"
  - file: gfonts://Roboto
    id: font_mode
    size: 28
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz:-./0123456789 "
  - file: gfonts://Roboto
    id: font_ui
    size: 20
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789.-: "
  - file: gfonts://Roboto
    id: font_small
    size: 16
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 "
  - file: gfonts://Roboto
    id: font_mark
    size: 12
    glyphs: "A"
  - file: https://github.com/google/material-design-icons/raw/master/font/MaterialIcons-Regular.ttf
    id: font_icon
    size: 22
    glyphs: "\uE314\uE315\uE430\uEB3B\uE863\uE798\uEA18\uE8AC"
    extras:
      - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
        glyphs: "\U000F0210"
  - file: https://github.com/google/material-design-icons/raw/master/font/MaterialIcons-Regular.ttf
    id: font_mode_icon
    size: 44
    glyphs: "\uE430\uEB3B\uE863\uE798\uE8AC"
    extras:
      - file: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
        glyphs: "\U000F0210"

lvgl:
  displays:
    - tft_display
  touchscreens:
    - tft_touch
  rotation: 90°
  buffer_size: 25%
  bg_color: 0x101418
  text_color: 0xF4F7FB
  # Idle clock resets on each touch. After 30s, leave settings if it
  # is open and let that frame reach the panel. Pause freezes whatever
  # is already on screen, so the dim happens only after the main page
  # has been drawn. The setup page stays bright so the hotspot
  # password can be read.
  on_idle:
    timeout: 30s
    then:
      - if:
          condition:
            not:
              lvgl.page.is_showing: setup_page
          then:
            - if:
                condition:
                  lvgl.page.is_showing: settings_page
                then:
                  - script.execute: settings_back
                  - delay: 400ms
            - light.turn_on:
                id: backlight
                brightness: 65%
            - lvgl.pause:
  pages:
    - id: main_page
      bg_color: 0x101418
      widgets:
        - button:
            id: mode_button
            align: TOP_MID
            y: 8
            width: 440
            height: 60
            radius: 16
            bg_color: 0x1A2330
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              flex_align_track: center
              pad_column: 8
            widgets:
              - label:
                  id: mode_icon
                  width: 48
                  height: 48
                  text_align: CENTER
                  text_font: font_mode_icon
                  text_color: 0xB7C0CA
                  text: "\uE863"
                  transform_pivot_x: 50%
                  transform_pivot_y: 50%
                  hidden: true
              - label:
                  id: mode_label
                  text: "Connecting"
                  text_font: font_mode
                  text_color: 0xF4F7FB
            on_click:
              - if:
                  condition:
                    lambda: 'return id(ac).has_live_state();'
                  then:
                    # Ask for a fresh reading. Settings opens on the last
                    # one and updates when MelCloud answers.
                    - lambda: 'id(ac).request_refresh();'
                    - lvgl.page.show: settings_page
                  else:
                    # Five taps inside 10 seconds, while the label says
                    # Connecting, open settings and reveal Reset.
                    - lambda: |-
                        const uint32_t now = millis();
                        if (id(reset_taps) <= 0 || now - id(reset_window_ms) > 10000) {
                          id(reset_taps) = 1;
                          id(reset_window_ms) = now;
                          return;
                        }
                        id(reset_taps) += 1;
                        if (id(reset_taps) >= 5) {
                          id(reset_taps) = -1;
                          id(reset_until_ms) = now + 30000;
                        }
                    - if:
                        condition:
                          lambda: 'return id(reset_taps) < 0;'
                        then:
                          - lambda: 'id(reset_taps) = 0;'
                          - lvgl.widget.update:
                              id: reset_button
                              hidden: false
                          - lvgl.page.show: settings_page
        - obj:
            id: status_row
            align: TOP_MID
            y: 70
            width: 440
            height: 32
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: false
            layout:
              type: flex
              flex_flow: row
              flex_align_main: center
              flex_align_cross: center
              flex_align_track: center
              pad_column: 6
            widgets:
              - obj:
                  id: fan_status_mark
                  width: 28
                  height: 28
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollable: false
                  hidden: true
                  widgets:
                    - label:
                        id: fan_status_icon
                        align: CENTER
                        width: 28
                        height: 28
                        text_align: CENTER
                        text_font: font_icon
                        text_color: 0xB7C0CA
                        text: "\U000F0210"
                        transform_pivot_x: 50%
                        transform_pivot_y: 50%
                        clickable: false
                    - label:
                        id: fan_status_auto
                        align: CENTER
                        x: 7
                        y: 5
                        text: "A"
                        text_font: font_mark
                        text_color: 0xF4F7FB
                        clickable: false
                        hidden: true
              - label:
                  id: status_label
                  text: "Connecting"
                  text_font: font_ui
                  text_color: 0x93A0B0
                  clickable: false
        - arc:
            id: setpoint_arc
            align: CENTER
            y: 12
            width: 292
            height: 292
            pad_all: 0
            adjustable: false
            min_value: 120
            max_value: 280
            value: 200
            arc_color: 0x243140
            arc_width: 16
            indicator:
              arc_color: 0x3DB7FF
              arc_width: 16
            knob:
              bg_opa: 0%
              border_width: 0
        - arc:
            id: room_arc
            align: CENTER
            y: 12
            width: 292
            height: 292
            pad_all: 0
            hidden: true
            adjustable: true
            clickable: false
            min_value: 120
            max_value: 280
            value: 200
            arc_width: 16
            arc_opa: 0%
            indicator:
              arc_width: 16
              arc_opa: 0%
            knob:
              bg_color: 0xF4F7FB
              bg_opa: 100%
              border_color: 0x101418
              border_width: 3
              pad_all: 3
        - label:
            id: setpoint_label
            align: CENTER
            y: -8
            text: "--"
            text_font: font_setpoint
            text_color: 0xF4F7FB
        - label:
