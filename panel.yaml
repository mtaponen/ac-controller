script:
  - id: settings_back
    then:
      - lvgl.page.show: main_page
  - id: show_setup_if_needed
    then:
      - if:
          condition:
            wifi.ap_active:
          then:
            - if:
                condition:
                  not:
                    lvgl.page.is_showing: setup_page
                then:
                  - lvgl.page.show: setup_page
                  - light.turn_on:
                      id: backlight
                      brightness: 100%

interval:
  - interval: 500ms
    then:
      - script.execute: show_setup_if_needed
      - if:
          condition:
            and:
              - lambda: 'return id(reset_until_ms) != 0;'
              - not:
                  lvgl.page.is_showing: reset_page
              - lambda: 'return static_cast<int32_t>(millis() - id(reset_until_ms)) >= 0;'
          then:
            - lambda: 'id(reset_until_ms) = 0;'
            - lvgl.widget.update:
                id: reset_button
                hidden: true
            - if:
                condition:
                  and:
                    - lvgl.page.is_showing: settings_page
                    - lambda: 'return !id(ac).has_live_state();'
                then:
                  - lvgl.page.show: main_page
      - if:
          condition:
            and:
              - lvgl.page.is_showing: settings_page
              - lambda: 'return !id(ac).has_live_state() && id(reset_until_ms) == 0;'
          then:
            - lvgl.page.show: main_page
      - lvgl.label.update:
          id: mode_label
          text: !lambda 'return id(ac).mode_line();'
      - lvgl.label.update:
          id: status_label
          text: !lambda 'return id(ac).status_text();'
      - lambda: |-
          auto paint = [](lv_obj_t *obj, const char *glyph, int angle, float scale) {
            lv_label_set_text(obj, glyph);
            lv_obj_set_style_transform_rotation(obj, angle * 10, LV_PART_MAIN);
            lv_obj_set_style_transform_scale(obj, (int32_t) (scale * 256.0f), LV_PART_MAIN);
          };
          if (id(ac).has_live_state()) {
            lv_obj_remove_flag(id(mode_icon), LV_OBJ_FLAG_HIDDEN);
            paint(id(mode_icon), id(ac).mode_icon(), 0, 1.0f);
            lv_obj_set_style_text_color(id(mode_icon), lv_color_hex(id(ac).mode_icon_color()), LV_PART_MAIN);
            lv_obj_remove_flag(id(fan_status_mark), LV_OBJ_FLAG_HIDDEN);
            paint(id(fan_status_icon), id(ac).current_fan_icon(), 0, id(ac).current_fan_scale());
            if (id(ac).current_fan_is_auto()) {
              lv_obj_remove_flag(id(fan_status_auto), LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_add_flag(id(fan_status_auto), LV_OBJ_FLAG_HIDDEN);
            }
          } else {
            lv_obj_add_flag(id(mode_icon), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(fan_status_mark), LV_OBJ_FLAG_HIDDEN);
          }
          paint(id(fan_icon_0), id(ac).fan_icon(0), 0, id(ac).fan_scale(0));
          if (id(ac).fan_is_auto(0)) {
            lv_obj_remove_flag(id(fan_auto_0), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(fan_auto_0), LV_OBJ_FLAG_HIDDEN);
          }
          paint(id(fan_icon_1), id(ac).fan_icon(1), 0, id(ac).fan_scale(1));
          paint(id(fan_icon_2), id(ac).fan_icon(2), 0, id(ac).fan_scale(2));
          paint(id(fan_icon_3), id(ac).fan_icon(3), 0, id(ac).fan_scale(3));
          paint(id(fan_icon_4), id(ac).fan_icon(4), 0, id(ac).fan_scale(4));
          paint(id(fan_icon_5), id(ac).fan_icon(5), 0, id(ac).fan_scale(5));
          auto paint_bar = [](lv_obj_t *obj, bool selected) {
            lv_obj_set_style_bg_color(obj, lv_color_hex(selected ? 0xF4F7FB : 0x3A4654), LV_PART_MAIN);
          };
          paint_bar(id(vv_bar_1), id(ac).vane_v_selected(1));
          paint_bar(id(vv_bar_2), id(ac).vane_v_selected(2));
          paint_bar(id(vv_bar_3), id(ac).vane_v_selected(3));
          paint_bar(id(vv_bar_4), id(ac).vane_v_selected(4));
          paint_bar(id(vv_bar_5), id(ac).vane_v_selected(5));
          paint_bar(id(vh_bar_1), id(ac).vane_h_selected(1));
          paint_bar(id(vh_bar_2), id(ac).vane_h_selected(2));
          paint_bar(id(vh_bar_3), id(ac).vane_h_selected(3));
          paint_bar(id(vh_bar_4), id(ac).vane_h_selected(4));
          paint_bar(id(vh_bar_5), id(ac).vane_h_selected(5));
      - lvgl.label.update:
          id: setpoint_label
          text: !lambda 'return id(ac).setpoint_text();'
      - lvgl.label.update:
          id: room_label
          text: !lambda 'return id(ac).room_text();'
      - if:
          condition:
            lambda: 'return id(ac).has_live_state();'
          then:
            - lvgl.arc.update:
                id: setpoint_arc
                min_value: !lambda 'return id(ac).arc_min();'
                max_value: !lambda 'return id(ac).arc_max();'
                value: !lambda 'return id(ac).arc_value();'
            - lvgl.arc.update:
                id: room_arc
                min_value: !lambda 'return id(ac).arc_min();'
                max_value: !lambda 'return id(ac).arc_max();'
                value: !lambda 'return id(ac).arc_room();'
            - lvgl.widget.update:
                id: room_arc
                hidden: false
          else:
            - lvgl.widget.update:
                id: room_arc
                hidden: true
      - lvgl.widget.update:
          id: mode_heat
          state:
            checked: !lambda 'return id(ac).mode_is("heat");'
      - lvgl.widget.update:
          id: mode_dry
          state:
            checked: !lambda 'return id(ac).mode_is("dry");'
      - lvgl.widget.update:
          id: mode_cool
          state:
            checked: !lambda 'return id(ac).mode_is("cool");'
      - lvgl.widget.update:
          id: mode_auto
          state:
            checked: !lambda 'return id(ac).mode_is("auto");'
      - lvgl.widget.update:
          id: mode_off
          state:
            checked: !lambda 'return id(ac).mode_is("off");'
      - lvgl.label.update:
          id: fan_label_0
          text: !lambda 'return id(ac).fan_label(0);'
      - lvgl.widget.update:
          id: fan_0
          hidden: !lambda 'return id(ac).fan_count() <= 0;'
          state:
            checked: !lambda 'return id(ac).fan_selected(0);'
      - lvgl.label.update:
          id: fan_label_1
          text: !lambda 'return id(ac).fan_label(1);'
      - lvgl.widget.update:
          id: fan_1
          hidden: !lambda 'return id(ac).fan_count() <= 1;'
          state:
            checked: !lambda 'return id(ac).fan_selected(1);'
      - lvgl.label.update:
          id: fan_label_2
          text: !lambda 'return id(ac).fan_label(2);'
